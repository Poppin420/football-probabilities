# Live panel: every 15 minutes in the afternoon / evening (UTC) one run starts and, during about 10 minutes, asks
# football-data.org 4 times (every ~200 s) which matches are being played. A tiny file live.json goes to its own
# branch "live" (the page reads it) whenever something changed. GitHub often delays or skips scheduled runs, so a
# run that covers several minutes is more reliable than one run every 5 minutes. The free plan shows scores with
# a delay, so the panel is "almost live".
name: Live αγώνες

on:
  schedule:
    - cron: '2,17,32,47 9-23 * * *'
  workflow_dispatch:

# Runs queue one behind the other (the one waiting is replaced by a newer one); a running one is never cut off.
concurrency:
  group: live-branch
  cancel-in-progress: false

permissions:
  contents: write # needed to push the branch "live"

jobs:
  live:
    name: Live αγώνες
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Λήψη του κώδικα
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Εγκατάσταση Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Προηγούμενο live.json
        run: node scripts/data-branch.mjs fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_BRANCH: live
          PREV_DIR: live-prev

      - name: Αγώνες που παίζονται (4 φορές, κάθε ~3 λεπτά)
        run: |
          mkdir -p live-prev
          fails=0
          for i in 1 2 3 4; do
            rm -rf live-out
            if node scripts/live.mjs; then
              if [ -f live-out/live.json ]; then
                node scripts/data-branch.mjs publish && cp live-out/live.json live-prev/live.json || fails=$((fails + 1))
              fi
            else
              fails=$((fails + 1))
            fi
            if [ "$i" -lt 4 ]; then sleep 200; fi
          done
          if [ "$fails" -ge 4 ]; then
            echo "::error::Το live panel απέτυχε και στις 4 προσπάθειες (δες τα μηνύματα παραπάνω)."
            exit 1
          fi
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DATA_BRANCH: live
          PREV_DIR: live-prev
          OUT_DIR: live-out
