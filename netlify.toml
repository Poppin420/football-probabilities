# Netlify only serves the static folder "public".
# No build command and no environment variables are needed: the data are
# computed by GitHub Actions and read by the page straight from GitHub.

[build]
  publish = "public"

# The page runs no inline scripts or styles and talks only to itself and to
# raw.githubusercontent.com (where the GitHub Action publishes the JSON files).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
